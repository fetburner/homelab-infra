apiVersion: apps/v1
kind: Deployment
metadata:
  name: epgstation-nginx
spec:
  template:
    spec:
      containers:
        - name: nginx
          image: ghcr.io/fetburner/nginx:4d4a10284d91ce5a90c961edf6c6008252797bda
          resources:
            limits:
              cpu: 0.5
              memory: 200Mi
              ephemeral-storage: 32M
            requests:
              cpu: 0.1
              memory: 150Mi
              ephemeral-storage: 32M
      volumes:
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: nginx-pid
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
