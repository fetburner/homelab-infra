apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: epgstation-mirakc
spec:
  template:
    spec:
      nodeSelector:
        epgstation.fetburner.dev/tuner: dvb
      containers:
        - name: mirakc
          image: ghcr.io/fetburner/mirakc:bded984063399f26b1ad4bdda89039772cf1ef70
          env:
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: mirakc-tuner
              mountPath: /dev/dvb
            - name: epgstation-mirakc-epg
              mountPath: /var/lib/mirakc/epg
            - name: epgstation-mirakc-records
              mountPath: /var/lib/mirakc/records
            - name: epgstation-mirakc-recording
              mountPath: /var/lib/mirakc/recording
          resources:
            requests:
              cpu: 0.1
              memory: 32M
              ephemeral-storage: 50M
            limits:
              cpu: 2
              memory: 256M
              ephemeral-storage: 50M
      volumes:
        - name: mirakc-tuner
          hostPath:
            path: /dev/dvb
  volumeClaimTemplates:
    - metadata:
        labels:
          app.kubernetes.io/name: epgstation-mirakc-epg
          app.kubernetes.io/part-of: epgstation
        name: epgstation-mirakc-epg
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 32Mi
    - metadata:
        labels:
          app.kubernetes.io/name: epgstation-mirakc-records
          app.kubernetes.io/part-of: epgstation
        name: epgstation-mirakc-records
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 32Mi
    - metadata:
        labels:
          app.kubernetes.io/name: epgstation-mirakc-recording
          app.kubernetes.io/part-of: epgstation
        name: epgstation-mirakc-recording
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: epgstation-epgstation
spec:
  template:
    spec:
      nodeName: js50
      containers:
        - name: epgstation
          image: ghcr.io/fetburner/epgstation:cb68f1aaab1e67ead03cd0f491ea797dd44115e0
          envFrom:
            - secretRef:
                name: tidb-serverless
          resources:
            requests:
              cpu: 0.1
              memory: 256M
              ephemeral-storage: 1G
            limits:
              cpu: 2
              memory: 2G
              ephemeral-storage: 1G
          volumeMounts:
            - name: epgstation-graphics-driver
              mountPath: /dev/dri
            - name: epgstation-epgstation-logs
              mountPath: /app/logs
            - name: epgstation-epgstation-drop
              mountPath: /app/drop
            - name: epgstation-epgstation-thumbnail
              mountPath: /app/thumbnail
            - name: epgstation-epgstation-streamfiles
              mountPath: /app/data/streamfiles
            - name: epgstation-epgstation-recorded
              mountPath: /app/recorded
      volumes:
        - name: epgstation-graphics-driver
          hostPath:
            path: /dev/dri
        - name: epgstation-epgstation-logs
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: epgstation-config
          configMap:
            name: epgstation-epgstation
  volumeClaimTemplates:
    - metadata:
        labels:
          app.kubernetes.io/name: epgstation-epgstation-drop
          app.kubernetes.io/part-of: epgstation
        name: epgstation-epgstation-drop
      spec:
        storageClassName: ds420plus-kagawa
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 128Mi
    - metadata:
        labels:
          app.kubernetes.io/name: epgstation-epgstation-thumbnail
          app.kubernetes.io/part-of: epgstation
        name: epgstation-epgstation-thumbnail
      spec:
        storageClassName: ds420plus-kagawa
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        labels:
          app.kubernetes.io/name: epgstation-epgstation-streamfiles
          app.kubernetes.io/part-of: epgstation
        name: epgstation-epgstation-streamfiles
      spec:
        storageClassName: ds420plus-kagawa
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
    - metadata:
        labels:
          app.kubernetes.io/name: epgstation-epgstation-recorded
          app.kubernetes.io/part-of: epgstation
        name: epgstation-epgstation-recorded
      spec:
        storageClassName: ds420plus-kagawa
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
