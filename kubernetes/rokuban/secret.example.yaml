# このファイルは参考用で、kustomization の resources には含めない。
# Neon の direct endpoint と private GHCR の認証情報を、クラスタ外の Secret
# として作成してから Deployment を起動する。
#
# dockerconfigjson-ghcr は namespace scoped なので、epgstation namespace にある
# 同名 Secret は自動では共有されない。rokuban namespace に別途作成する。
# Deployment の imagePullSecrets が initContainer と本体の両方に適用される。
#
# PostgreSQL（Neon の direct endpoint を使用）:
#
#   kubectl -n rokuban create secret generic rokuban-secrets \
#     --from-literal=POSTGRES_HOST='ep-xxxxxxxx.ap-southeast-1.aws.neon.tech' \
#     --from-literal=POSTGRES_USER='rokuban' \
#     --from-literal=POSTGRES_DB='rokuban' \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Private GHCR（既存の EPGStation 用 Secret を参考に、rokuban namespace にも作る）:
#
#   export GHCR_TOKEN='...'  # read:packages を持つトークン
#   kubectl -n rokuban create secret docker-registry dockerconfigjson-ghcr \
#     --docker-server=ghcr.io \
#     --docker-username=fetburner \
#     --docker-password="$GHCR_TOKEN"
#
# Secret の更新後は、必要に応じて次で Pod を再作成する。
#
#   kubectl -n rokuban rollout restart deployment/rokuban
#
# 初期確認は入口をまだ持たせず、Service を port-forward する。
#
#   kubectl -n rokuban port-forward svc/rokuban-api 40773:40773
#
# POSTGRES_CONNECTION_STRING は KEDA の PostgreSQL trigger を導入する段階で追加
# する（初期の server --all 自体はこの値を参照しない）。
