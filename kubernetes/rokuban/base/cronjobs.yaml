# site 非依存 + site 束縛（single site "default"）の定期投入をまとめたもの。
# `worker.periodic_jobs: false` にしたので、投入経路はここだけである。
#
# schedule は参照実装（deploy/k8s/{base,site}/cronjobs.yaml）の実運用値と揃える。
# enqueue は insert-only の River クライアント（ffmpeg・ファイルシステム不要）だが、
# homelab は rokuban-full 一本で回すので image もそれに揃えている。
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rokuban-enqueue-catalog-export
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: enqueue
spec:
  schedule: "0 4 * * *"
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rokuban
            app.kubernetes.io/component: enqueue
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: dockerconfigjson-ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enqueue
              image: ghcr.io/fetburner/rokuban-full:latest
              imagePullPolicy: IfNotPresent
              args: ["enqueue", "catalog-export", "--config", "/etc/rokuban/config.yml"]
              envFrom:
                - secretRef:
                    name: rokuban-secrets
              volumeMounts:
                - name: config
                  mountPath: /etc/rokuban
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: config
              configMap:
                name: rokuban-config
---
