# streamer ロール。録画配信（VOD・サムネイル）+ ライブ視聴（mirakc → ffmpeg → HLS）を担う。
# live.enabled: true のため site 束縛（--sites default）が必須。VAAPI を使うので
# /dev/dri を要し、nodeName js50 への pin と supplementalGroups は overlay で当てる。
# 参照実装 deploy/k8s/base/streamer.yaml の homelab 移植版（homelab は live も同 Pod に載せる）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokuban-streamer
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: streamer
    app.kubernetes.io/part-of: rokuban
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rokuban
      app.kubernetes.io/component: streamer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban
        app.kubernetes.io/component: streamer
        app.kubernetes.io/part-of: rokuban
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40773"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerconfigjson-ghcr
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamer
          image: ghcr.io/fetburner/rokuban-full:latest
          imagePullPolicy: IfNotPresent
          # live を載せるので site 束縛（--sites default）。空だと起動しない。
          args: ["server", "--roles", "streamer", "--sites", "default", "--config", "/etc/rokuban/config.yml"]
          ports:
            - name: http
              containerPort: 40773
          envFrom:
            - secretRef:
                name: rokuban-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: config
              mountPath: /etc/rokuban
              readOnly: true
            # VOD は読むだけ。書き込みは worker が行う。
            - name: media
              mountPath: /mnt/media
              readOnly: true
            # live.segment_dir 用の tmpfs。
            - name: live-shm
              mountPath: /dev/shm
          securityContext:
            # /dev/dri を hostPath で渡す。GPU device plugin が無いので
            # device cgroup 制限を越えるには privileged が必要。
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 4
              memory: 2Gi
              ephemeral-storage: 4Gi
      volumes:
        - name: config
          configMap:
            name: rokuban-config
        - name: media
          persistentVolumeClaim:
            claimName: rokuban-media
        - name: live-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
