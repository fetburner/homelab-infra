apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokuban
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: monolith
    app.kubernetes.io/part-of: rokuban
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rokuban
      app.kubernetes.io/component: monolith
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban
        app.kubernetes.io/component: monolith
        app.kubernetes.io/part-of: rokuban
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40773"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerconfigjson-ghcr
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/fetburner/rokuban-full:latest
          imagePullPolicy: Always
          args: ["migrate", "up", "--config", "/etc/rokuban/config.yml"]
          envFrom:
            - secretRef:
                name: rokuban-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/rokuban
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: rokuban
          image: ghcr.io/fetburner/rokuban-full:latest
          imagePullPolicy: Always
          args: ["server", "--all", "--config", "/etc/rokuban/config.yml"]
          envFrom:
            - secretRef:
                name: rokuban-secrets
          ports:
            - name: http
              containerPort: 40773
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: config
              mountPath: /etc/rokuban
              readOnly: true
            - name: media
              mountPath: /mnt/media
            - name: scratch
              mountPath: /var/tmp/rokuban
            # live.segment_dir 用。live.enabled=false の間も先に用意しておく。
            - name: live-shm
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 4
              memory: 2Gi
              ephemeral-storage: 4Gi
      volumes:
        - name: config
          configMap:
            name: rokuban-config
        - name: media
          persistentVolumeClaim:
            claimName: rokuban-media
        - name: scratch
          emptyDir: {}
        - name: live-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
