# worker ロール（monolith の残り）。api / notifier / streamer / watcher は
# api.yaml / notifier.yaml / streamer.yaml / watcher.yaml へ分離した。
# worker は encode / thumbnail で VAAPI を使うため /dev/dri を要し、ingest /
# reconciler など site 束縛キューを引くため --sites default が必須。
# /dev/dri の nodeName pin と supplementalGroups は overlay で当てる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokuban
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: rokuban
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rokuban
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: rokuban
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40773"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerconfigjson-ghcr
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rokuban
          image: ghcr.io/fetburner/rokuban-full:latest
          imagePullPolicy: Always
          args: ["server", "--roles", "worker", "--sites", "default", "--config", "/etc/rokuban/config.yml"]
          envFrom:
            - secretRef:
                name: rokuban-secrets
          ports:
            - name: http
              containerPort: 40773
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: config
              mountPath: /etc/rokuban
              readOnly: true
            - name: media
              mountPath: /mnt/media
            - name: scratch
              mountPath: /var/tmp/rokuban
          securityContext:
            # /dev/dri は hostPath で渡しており、クラスタには GPU device plugin が
            # 無いため、デバイス cgroup 制限を越えるには privileged が必要。
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 4
              memory: 2Gi
              ephemeral-storage: 4Gi
      volumes:
        - name: config
          configMap:
            name: rokuban-config
        - name: media
          persistentVolumeClaim:
            claimName: rokuban-media
        - name: scratch
          emptyDir: {}
