# 初期は docker-compose の server --all 相当で動かす。
# role を分ける段階で worker.periodic_jobs を false にし、CronJob/KEDA を追加する。

server:
  listen: ":40773"
  allowed_hosts: [rokuban.fetburner.dev]

db:
  # PostgreSQL の接続先は Secret から注入する。
  host: ${POSTGRES_HOST}
  port: 5433
  user: ${POSTGRES_USER}
  password: >-
    ${POSTGRES_PASSWORD}
  database: ${POSTGRES_DB}
  # NAS 上の Docker PostgreSQL は TLS を有効化していない。
  sslmode: disable

mirakcs:
  - site: default
    # EPGStation namespace の既存 mirakc Service（headless）を共有する。
    url: http://mirakc.epgstation.svc.cluster.local:40772

worker:
  # 定期ジョブは in-process では投げない。River の PeriodicJobs はリーダーだけが
  # 投入するので、worker を 0 にスケールする構成では誰も投入しなくなる。投入は
  # CronJob（rokuban enqueue）が担う。
  periodic_jobs: false

encode:
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  concurrency: 1
  thumbnail_concurrency: 1
  # Intel GPU の VAAPI を使う初期プロファイル。
  # ルールや API からはこの名前（h264_vaapi）を指定する。
  profiles:
    - name: h264_vaapi
      container: mp4
      video_codec: h264_vaapi
      audio_codec: aac
      height: 1080
      scaler: vaapi
      deinterlace: true
      qp: 24
      hwaccel:
        kind: vaapi
        device: /dev/dri/renderD128
        output_format: vaapi
    # CM カット版。確認・保存済みのチャプターにある cut=true 区間を除去する。
    # Rokuban upstream の cut 対応により、CM カット中も VAAPI の HW デコード /
    # デインターレース / スケーリング / エンコードを使う。
    - name: h264_vaapi_cmcut
      container: mp4
      video_codec: h264_vaapi
      audio_codec: aac
      height: 1080
      scaler: vaapi
      deinterlace: true
      qp: 24
      hwaccel:
        kind: vaapi
        device: /dev/dri/renderD128
        output_format: vaapi
      cut: true

# JLSE による CM 検出。worker（rokuban Deployment）が cm_detect キューを引く。
# logoframe / chapter_exe / join_logo_scp は rokuban-full イメージに同梱されている
# （Dockerfile/rokuban-full の jls ステージ）。起動時に 3 本 + ffprobe + ルール
# ファイル（/usr/local/share/rokuban/cm_detect/JL_標準.txt）の存在を検査するので、
# 公式の ffmpeg なしイメージにこの設定だけ載せると起動エラーになる。
cm_detect:
  enabled: true
  binary_dir: /usr/local/bin
  # 未完了分を拾い直す定期投入は CronJob（rokuban-enqueue-cm-detect-reconcile）が担う。

storage:
  media_dir: /mnt/media
  scratch_dir: /var/tmp/rokuban

ingest:
  # mirakc サイトあたりの ingest 同時実行数。2 チューナー機の「2 本同時録画 +
  # 全速 pull 1 本」で式の下端（docs/recording/ingest.md §5.4）。足りないと追従が
  # 枠待ちになり、UI に取り込み待ちが続く。接続プールの予算は自動で追随する。
  concurrency: 3

epg:
  sync_interval: 10m
  retention_grace: 24h

live:
  # 単一 Pod の server --all でライブも提供する。KEDA/role 分割後も
  # streamer 側へこの設定を引き継ぐ。
  enabled: true
  segment_dir: /dev/shm/rokuban-live
  max_sessions: 4
  idle_timeout: 30s
  tuner_priority: 1
  hwaccel:
    kind: vaapi
    device: /dev/dri/renderD128
    output_format: vaapi
  profiles:
    - name: h264
      video_codec: h264_vaapi
      audio_codec: aac
      height: 720
      scaler: vaapi
      deinterlace: true
      qp: 26
      segment_seconds: 2
      playlist_size: 6
    - name: h264-low
      video_codec: h264_vaapi
      audio_codec: aac
      height: 360
      scaler: vaapi
      deinterlace: true
      qp: 28
      segment_seconds: 2
      playlist_size: 6
  # 現在の Debian FFmpeg には libaribcaption を含めていないため無効。
  captions: false

log:
  level: info
  format: json
