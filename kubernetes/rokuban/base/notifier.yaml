# notifier ロール。Postgres の NOTIFY を購読してブラウザへ SSE (/api/events) を配る。
# mirakc にもファイルシステムにも触らない。参照実装 deploy/k8s/base/notifier.yaml 移植。
#
# **参照実装は replicas: 2（各レプリカが自分で LISTEN するだけで調停が無い役）だが、
# homelab は一旦 1。** 1 なので再起動で SSE が全断する（クライアントは再接続する）。
# 副作用は pdb.yaml のコメントを参照（PDB は minAvailable: 1 のままで drain がブロックする）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokuban-notifier
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: notifier
    app.kubernetes.io/part-of: rokuban
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rokuban
      app.kubernetes.io/component: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban
        app.kubernetes.io/component: notifier
        app.kubernetes.io/part-of: rokuban
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40773"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerconfigjson-ghcr
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rokuban
              app.kubernetes.io/component: notifier
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifier
          image: ghcr.io/fetburner/rokuban-full:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "--roles", "notifier", "--sites=", "--config", "/etc/rokuban/config.yml"]
          ports:
            - name: http
              containerPort: 40773
          envFrom:
            - secretRef:
                name: rokuban-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: config
              mountPath: /etc/rokuban
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: rokuban-config
