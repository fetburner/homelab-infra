apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rokuban

resources:
  - ../base
  - ingress.yaml

patches:
  - path: deployment.patch.yaml
  - path: streamer.patch.yaml

images:
  # タグには Dockerfile/rokuban-full の FROM 更新をビルドした
  # homelab-infra commit sha を指定する（CI が github.sha で push）。
  #
  # 各 manifest の imagePullPolicy は IfNotPresent。ここで差すタグが commit sha で
  # 不変なので、ノードに一度載れば以降はレジストリに一切触らない（CronJob が
  # 毎分 Pod を作るため、Always だと 1 日 1440 回 ghcr.io を引きに行っていた）。
  # 結果として ghcr.io の rate limit も、Pi 側の DNS の一時失敗も踏まなくなる。
  - name: ghcr.io/fetburner/rokuban-full
    newTag: 6f934e9fb4146ec02ca8705c631e4afa05c4c9c8
