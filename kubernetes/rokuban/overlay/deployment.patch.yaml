apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokuban
spec:
  template:
    spec:
      # EPGStation と同じ Intel GPU ノードを使う。mirakc の DVB ノードとは
      # 別用途なので、チューナーの nodeSelector はここでは付けない。
      nodeName: js50
      # js50 の /dev/dri は video=44、render=992。ホストの /dev/dri を
      # non-root の rokuban から利用するために補助グループへ追加する。
      securityContext:
        supplementalGroups:
          - 44
          - 992
      containers:
        - name: rokuban
          volumeMounts:
            - name: graphics-driver
              mountPath: /dev/dri
      volumes:
        - name: graphics-driver
          hostPath:
            path: /dev/dri
            type: Directory
